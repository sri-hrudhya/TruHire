name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # weekly: new advisories appear without any code change

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check backend tests scripts

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truhire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/truhire
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      APP_ENV: test
      VLLM_BASE_URL: http://127.0.0.1:1/v1
      QDRANT_URL: http://127.0.0.1:6399
      OPENSEARCH_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The laya extra is needed: without it the AI guardrails cannot verify email drafts and those tests fail.
      - run: uv sync --frozen --extra laya
      - run: python scripts/fake_qdrant.py 6399 &
      - run: uv run --no-sync pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx vite build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv export --frozen --no-hashes --no-dev --extra laya --format requirements-txt -o /tmp/requirements-audit.txt
      - run: uvx pip-audit -r /tmp/requirements-audit.txt --no-deps --disable-pip
      - run: npm audit --omit=dev
        working-directory: frontend

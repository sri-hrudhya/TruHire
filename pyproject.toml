[project]
name = "truhire"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "arq>=0.26.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.110.0",
    "fastembed>=0.4.0",
    "httpx>=0.27.0",
    "laya>=0.1.0",
    "numpy>=1.26.0",
    "opensearch-py>=2.4.2",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.28",
    "uvicorn[standard]>=0.28.0",
    "python-docx>=1.2.0",
    "rapidocr-onnxruntime>=1.4.4",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
]

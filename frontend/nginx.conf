server {
    listen 80;
    server_name localhost;

    # Maximum upload size for resumes & job descriptions (50 MB)
    client_max_body_size 50M;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Root folder for Vite production build
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Cache static assets with content hashes indefinitely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Single Page Application fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:8999/api/;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original host & client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses (LLM output, export)
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Generous timeouts for large file uploads & deep LLM/embedding inference
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Swagger / OpenAPI documentation
    location /docs {
        proxy_pass http://backend:8999/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8999/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8999/openapi.json;
        proxy_set_header Host $host;
    }

    # Container healthcheck endpoint
    location /health {
        access_log off;
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}

